  - name: CreateAudienceContact_class
    type: enum
    inVocab: false
    symbols: ["mailchimp:CreateAudienceContact"]

  - name: CreateAudienceContact
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "Add Contact"
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#CreateAudienceContact_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: audience_id
        type: string
        doc: "The unique ID for the audience."
      - name: merge_field_validation_mode
        type: ["null", "string"]
        doc: "Defines how merge field validation is handled. When set to `ignore_required_checks`, the API does not raise an error if required merge fields are missing from the request. When set to `strict`, the API enforces validation and returns an error if any required merge field is not provided. If this setting is omitted, `strict` is applied by default."
      - name: data_mode
        type: ["null", "string"]
        doc: "Indicates the data processing mode. In `historical` mode, contact data changes do not trigger automations or webhooks. In `live mode`, such changes do trigger them."
      - name: email_channel
        type: ["null", "Any"]
      - name: language
        type: ["null", "string"]
        doc: "The subscribers detected language."
      - name: merge_fields
        type: ["null", "Any"]
        doc: "A dictionary of merge fields where the keys are the merge tags. See the [Merge Fields documentation](https://mailchimp.com/developer/marketing/docs/merge-fields/#structure) for more about the structure."
      - name: sms_channel
        type: ["null", "Any"]
      - name: tags
        type: ["null", "Any"]
        doc: "An array of tag names to add to the contact. This operation is append-only; existing tags will be preserved, and only new tags from this array will be added."
      - name: update_existing
        type: ["null", "boolean"]
        doc: "If a contact already exists, update them instead of returning a conflict error. When `true` and a matching contact is found (by email or phone), the existing contact is updated with the provided channel data. Defaults to `false`."

