  - name: CalculateItems_class
    type: enum
    inVocab: false
    symbols: ["eventbrite:CalculateItems"]

  - name: CalculateItems
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "Calculate Items"
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#CalculateItems_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: absorb_fees
        type: ["null", "boolean"]
        doc: "If set to true, the Fees will be included in the base price provided instead of adding them on top of it. False by default."
      - name: absorb_taxes
        type: ["null", "boolean"]
        doc: "If set to true, the Taxes will be included in the base price provided instead of adding them on top of it. False by default."
      - name: base_price
        type: string
        doc: "The base price for the calculation."
      - name: channel
        type: ["null", "string"]
        doc: "Sales channel used to calculate the price. If it’s not provided, web will be used by default."
      - name: country
        type: string
        doc: "ISO 3166 2-letter country code where the event would be payed out."
      - name: payment_type
        type: ["null", "string"]
        doc: "The payment type used to calculate the price. If it’s not provided, eventbrite will be used by default."
      - name: scope
        type: Any
        doc: "The scope for which the item calculations will be made."

