version: "3"

vars:
  CONNECTOR_NAME: eventbrite
  YARDRAIL_ROOT:
    sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'

tasks:
  spec:
    desc: "Convert Eventbrite API Blueprint to OpenAPI 3.0"
    dir: "{{.TASKFILE_DIR}}/spec"
    cmds:
      - mise exec -- npx --yes api-spec-converter@2 --from api_blueprint --to swagger_2 eventbrite-api-v3-public.apib > swagger2.json
      - python3 fixup.py swagger2 swagger2.json swagger2-fixed.json
      - mise exec -- npx --yes swagger2openapi@7 --patch swagger2-fixed.json -o openapi.json
      - python3 fixup.py openapi3 openapi.json
      - rm swagger2.json swagger2-fixed.json

  client:
    desc: "Generate Eventbrite Go client from OpenAPI spec"
    deps: [spec]
    cmds:
      - mise exec -- go generate ./client/...
      - mise exec -- go mod tidy

  connector:
    desc: "Generate Eventbrite yardrail connector code"
    deps: [client]
    dir: "{{.ROOT_DIR}}/tools"
    cmds:
      - >-
        go run ./cmd/yardrail-connector-codegen
        -manifest {{.TASKFILE_DIR}}/manifest.yaml
        -out {{.YARDRAIL_ROOT}}/internal/connectors/{{.CONNECTOR_NAME}}
        -catalog {{.YARDRAIL_ROOT}}/internal/connector/catalog_{{.CONNECTOR_NAME}}_gen.go
        -pkgname {{.CONNECTOR_NAME}}
        -cwl-schema {{.YARDRAIL_ROOT}}/pkg/workflows/schema/{{.CONNECTOR_NAME}}-ext.yml
        -cwl-mapping {{.YARDRAIL_ROOT}}/pkg/workflows/connector_{{.CONNECTOR_NAME}}_gen.go

  build:
    desc: "Build"
    cmds:
      - mise exec -- go build ./...

  test:
    desc: "Run tests"
    cmds:
      - mise exec -- go test ./...

  vet:
    desc: "Run go vet"
    cmds:
      - mise exec -- go vet ./...

  lint:
    desc: "Run all checks"
    cmds:
      - task: vet
      - task: build
      - task: test
