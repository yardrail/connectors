version: "3"

tasks:
  spec:
    desc: "Slack API spec (committed, manually managed)"
    cmds:
      - echo "spec is committed — update manually"

  client:
    desc: "Generate Slack Go client from OpenAPI spec"
    deps: [spec]
    cmds:
      - mise exec -- go generate ./client/...

  connector:
    desc: "Generate Slack connector code"
    deps: [client]
    dir: "{{.ROOT_DIR}}/tools"
    cmds:
      - >-
        mise exec -- go run ./cmd/yardrail-connector-codegen
        -manifest {{.TASKFILE_DIR}}/manifest.yaml
        -out {{.TASKFILE_DIR}}/connector/
        -pkgname connector
      - cd {{.TASKFILE_DIR}} && mise exec -- go mod tidy -e

  build:
    desc: "Build"
    cmds:
      - mise exec -- go build ./...

  test:
    desc: "Run tests"
    cmds:
      - mise exec -- go test ./...

  vet:
    desc: "Run go vet"
    cmds:
      - mise exec -- go vet ./...

  lint:
    desc: "Run all checks"
    cmds:
      - task: vet
      - task: build
      - task: test
