version: "3"

tasks:
  spec:
    desc: "OfficeRnD spec (committed, manually managed)"
    cmds:
      - echo "spec is committed — update manually"

  client:
    desc: "Generate OfficeRnD Go client"
    deps: [spec]
    cmds:
      - mise exec -- go generate ./client/...
      - mise exec -- go mod tidy

  connector:
    desc: "OfficeRnD connector codegen (no manifest yet)"
    deps: [client]
    cmds:
      - echo "no manifest.yaml — connector codegen not yet configured"

  build:
    desc: "Build"
    cmds:
      - mise exec -- go build ./...

  test:
    desc: "Run tests"
    cmds:
      - mise exec -- go test ./...

  vet:
    desc: "Run go vet"
    cmds:
      - mise exec -- go vet ./...

  lint:
    desc: "Run all checks"
    cmds:
      - task: vet
      - task: build
      - task: test
