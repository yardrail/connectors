version: "3"

tasks:
  spec:
    desc: "OfficeRnD v2 spec (committed, manually managed)"
    cmds:
      - echo "spec is committed — update manually"

  client:
    desc: "Generate OfficeRnD v2 Go client"
    deps: [spec]
    cmds:
      - go generate ./client/...
      - go mod tidy

  connector:
    desc: "OfficeRnD connector codegen (no manifest yet)"
    deps: [client]
    cmds:
      - echo "no manifest.yaml — connector codegen not yet configured"

  build:
    desc: "Build"
    cmds:
      - go build ./...

  test:
    desc: "Run tests"
    cmds:
      - go test ./...

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  lint:
    desc: "Run all checks"
    cmds:
      - task: vet
      - task: build
      - task: test
