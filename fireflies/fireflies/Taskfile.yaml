version: "3"

vars:
  CONNECTOR_NAME: fireflies
  YARDRAIL_ROOT:
    sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'

tasks:
  spec:
    desc: "Fireflies GraphQL schema (committed, manually managed)"
    cmds:
      - echo "schema is committed — update manually"

  client:
    desc: "Fireflies client generation (no-op for GraphQL)"
    deps: [spec]
    cmds:
      - echo "GraphQL connector — no client generation needed"

  connector:
    desc: "Generate Fireflies yardrail connector code"
    deps: [client]
    dir: "{{.ROOT_DIR}}/tools"
    cmds:
      - >-
        go run ./cmd/yardrail-connector-codegen
        -manifest {{.TASKFILE_DIR}}/manifest.yaml
        -out {{.YARDRAIL_ROOT}}/internal/connectors/{{.CONNECTOR_NAME}}
        -catalog {{.YARDRAIL_ROOT}}/internal/connector/catalog_{{.CONNECTOR_NAME}}_gen.go
        -pkgname {{.CONNECTOR_NAME}}
        -cwl-schema {{.YARDRAIL_ROOT}}/pkg/workflows/schema/{{.CONNECTOR_NAME}}-ext.yml
        -cwl-mapping {{.YARDRAIL_ROOT}}/pkg/workflows/connector_{{.CONNECTOR_NAME}}_gen.go

  build:
    desc: "Build"
    cmds:
      - mise exec -- go build ./...

  test:
    desc: "Run tests"
    cmds:
      - mise exec -- go test ./...

  vet:
    desc: "Run go vet"
    cmds:
      - mise exec -- go vet ./...

  lint:
    desc: "Run all checks"
    cmds:
      - task: vet
      - task: build
      - task: test
