      - name: ApplyTaxAfterDiscount
        type: ["null", "boolean"]
        doc: "If false or null, calculate the sales tax first, and then apply the discount. If true, subtract the discount first and then calculate the sales tax. US versions of QuickBooks only."
      - name: Balance
        type: ["null", "float"]
        doc: "The balance reflecting any payments made against the transaction. Initially set to the value of `TotalAmt`. A Balance of 0 indicates the invoice is fully paid. Calculated by QuickBooks business logic; any value you supply is over-written by QuickBooks."
      - name: BillAddr
        type: ["null", "Any"]
      - name: BillEmail
        type: ["null", "Any"]
      - name: ClassRef
        type: ["null", "Any"]
      - name: CurrencyRef
        type: ["null", "Any"]
      - name: CustomField 
        type: ["null", "Any"]
      - name: CustomerMemo
        type: ["null", "Any"]
      - name: CustomerRef
        type: Any
      - name: DepartmentRef
        type: ["null", "Any"]
      - name: DocNumber
        type: ["null", "string"]
        doc: "Reference number for the transaction. If not explicitly provided at create time, this field is populated based on the setting of `Preferences:CustomTxnNumber` as follows: If `Preferences:CustomTxnNumber` is true a custom value can be provided. If no value is supplied, the resulting DocNumber is null. If `Preferences:CustomTxnNumber` is false, resulting DocNumber is system generated by incrementing the last number by 1. If `Preferences:CustomTxnNumber` is false then do not send a value as it can lead to unwanted duplicates. If a DocNumber value is sent for an Update operation, then it just updates that particular invoice and does not alter the internal system DocNumber. Note: DocNumber is an optional field for all locales except France. For France locale if `Preferences:CustomTxnNumber` is enabled it will not be automatically generated and is a required field."
      - name: EmailStatus
        type: ["null", "string"]
        doc: "Email status of the credit-memo. Valid values: `NotSet`, `NeedToSend`, `EmailSent `"
      - name: ExchangeRate
        type: ["null", "float"]
        doc: "The number of home currency units it takes to equal one unit of currency specified by `CurrencyRef`. Applicable if multicurrency is enabled for the company."
      - name: GlobalTaxCalculation
        type: ["null", "string"]
      - name: HomeBalance
        type: ["null", "float"]
        doc: "Convenience field containing the amount in `Balance` expressed in terms of the home currency. Calculated by QuickBooks business logic. Value is valid only when `CurrencyRef` is specified. Applicable if multicurrency is enabled for the company."
      - name: HomeTotalAmt
        type: ["null", "float"]
        doc: "Total amount of the transaction in the home currency. Includes the total of all the charges, allowances and taxes. Calculated by QuickBooks business logic. Value is valid only when `CurrencyRef` is specified. Applicable if multicurrency is enabled for the company."
      - name: Id
        type: ["null", "string"]
        doc: "Unique identifier for this object."
      - name: Line
        type: Any
      - name: MetaData
        type: ["null", "Any"]
      - name: PaymentMethodRef
        type: ["null", "Any"]
      - name: PrintStatus
        type: ["null", "string"]
        doc: "Printing status of the credit-memo. Valid values: `NotSet`, `NeedToPrint`, `PrintComplete `."
      - name: PrivateNote
        type: ["null", "string"]
        doc: "User entered, organization-private note about the transaction. This note does not appear on the deposit form."
      - name: ProjectRef
        type: ["null", "Any"]
      - name: RecurDataRef
        type: ["null", "Any"]
      - name: RemainingCredit
        type: ["null", "float"]
        doc: "Indicates the total credit amount still available to apply towards the payment."
      - name: SalesTermRef
        type: ["null", "Any"]
      - name: ShipAddr
        type: ["null", "Any"]
      - name: SyncToken
        type: ["null", "string"]
        doc: "Version number of the object. It is used to lock an object for use by one app at a time. As soon as an application modifies an object, its `SyncToken` is incremented. Attempts to modify an object specifying an older `SyncToken` fails. Only the latest version of the object is maintained by QuickBooks Online."
      - name: TaxExemptionRef
        type: ["null", "Any"]
      - name: TotalAmt
        type: ["null", "float"]
        doc: "Indicates the total amount of the transaction. This includes the total of all the charges, allowances, and taxes. Calculated by QuickBooks business logic; any value you supply is over-written by QuickBooks."
      - name: TxnDate
        type: ["null", "string"]
        doc: "The date entered by the user when this transaction occurred. For posting transactions, this is the posting date that affects the financial statements. If the date is not supplied, the current date on the server is used. Sort order is ASC by default."
      - name: TxnTaxDetail
        type: ["null", "Any"]

