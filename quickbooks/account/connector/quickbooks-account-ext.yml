  - name: SendInvoice_class
    type: enum
    inVocab: false
    symbols: ["quickbooks-account:SendInvoice"]

  - name: SendInvoice
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "Send Invoice"
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#SendInvoice_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: realmId
        type: string
        doc: "The QuickBooks company ID (Realm ID)."
      - name: minorversion
        type: ["null", "int"]
        doc: "Minor version of the QBO API."
      - name: AllowIPNPayment
        type: ["null", "boolean"]
        doc: "Flag to allow payments from legacy Intuit Payment Network (IPN). Provided to maintain backward compatibility and must always be set to `false`. Do not modify"
      - name: AllowOnlineACHPayment
        type: ["null", "boolean"]
        doc: "Specifies if this invoice can be paid with online bank transfers and corresponds to the Bank transfer check box on the QuickBooks UI. Active when the company is payments-enabled, i.e., `Preferences.SalesFormsPrefs.ETransactionPaymentEnabled` is set to `true`. If set to `true`, allow invoice to be paid with online bank transfers. The Bank transfer check box is checked on the QuickBooks UI for this invoice. True by default if the company allows invoices to be paid with ACH. If set to `false`, online bank transfers are not allowed. The Bank transfer check box is not checked on the QuickBooks UI for this invoice."
      - name: AllowOnlineAffirmPayment
        type: ["null", "boolean"]
        doc: "Specifies if online Affirm payments are allowed for this invoice and corresponds to the Affirm check box on the QuickBooks UI. Active when the company is payments-enabled, i.e., `Preferences.SalesFormsPrefs.ETransactionPaymentEnabled` is set to `true` and the company has been onboarded for Affirm with an `ACTIVE` subscription status. If set to `true`, allow invoice to be paid with online Affirm payments. The Affirm check box is checked on the QuickBooks UI for this invoice. True by default if the company allows invoices to be paid with Affirm. If set to `false`, online Affirm payments are not allowed. The Affirm check box is not checked on the QuickBooks UI for this invoice. Defaults to the active subscription status. If a value is explicitly sent, that value is used. If no value is sent, the default value is used."
      - name: AllowOnlineCreditCardPayment
        type: ["null", "boolean"]
        doc: "Specifies if online credit card payments are allowed for this invoice and corresponds to the Credit card check box on the QuickBooks UI. Active when the company is payments-enabled, i.e., `Preferences.SalesFormsPrefs.ETransactionPaymentEnabled` is set to `true`. If set to `true`, allow invoice to be paid with online credit card payments. The Credit card check box is checked on the QuickBooks UI for this invoice. True by default if the company allows invoices to be paid with credit cards. If set to `false`, online credit card payments are not allowed. The Credit card check box is not checked on the QuickBooks UI for this invoice."
      - name: AllowOnlinePayPalPayment
        type: ["null", "boolean"]
        doc: "Specifies if online PayPal/Venmo payments are allowed for this invoice and corresponds to the PayPal check box on the QuickBooks UI. Active when the company is payments-enabled, i.e., `Preferences.SalesFormsPrefs.ETransactionPaymentEnabled` is set to `true` and the company has been onboarded for PayPal with an `ACTIVE` subscription status. If set to `true`, allow invoice to be paid with online PayPal payments. The PayPal check box is checked on the QuickBooks UI for this invoice. True by default if the company allows invoices to be paid with PayPal. If set to `false`, online PayPal payments are not allowed. The PayPal check box is not checked on the QuickBooks UI for this invoice. Defaults to the active subscription status. If a value is explicitly sent, that value is used. If no value is sent, the default value is used."
      - name: AllowOnlinePayment
        type: ["null", "boolean"]
        doc: "Deprecated flag to allow online payments. In use before `AllowOnlineCreditCardPayment` and `AllowOnlineACHPayment` flags existed and provided to maintain backward compatibility. If set to `true`, this invoice was created before `AllowOnlinePayment` was deprecated and denotes both CC and ACH payments are allowed. In addition, the `AllowOnlineCreditCardPayment` and `AllowOnlineACHPayment` flags must be set to `true`. If set to `false`, this invoice was created after the `AllowOnlinePayment` flag was deprecated and is not used. Do not modify."
      - name: ApplyTaxAfterDiscount
        type: ["null", "boolean"]
        doc: "If false or null, calculate the sales tax first, and then apply the discount. If true, subtract the discount first and then calculate the sales tax."
      - name: Balance
        type: ["null", "float"]
        doc: "The balance reflecting any payments made against the transaction. Initially set to the value of `TotalAmt`. A Balance of 0 indicates the invoice is fully paid. Calculated by QuickBooks business logic; any value you supply is over-written by QuickBooks. If you process a linked transaction against a specific transaction, the `balance` value won't change. It will remain the same."
      - name: BillAddr
        type: ["null", "Any"]
      - name: BillEmail
        type: ["null", "Any"]
      - name: BillEmailBcc
        type: ["null", "Any"]
      - name: BillEmailCc
        type: ["null", "Any"]
      - name: ClassRef
        type: ["null", "Any"]
      - name: CurrencyRef
        type: ["null", "Any"]
      - name: CustomField
        type: ["null", "Any"]
      - name: CustomerMemo
        type: ["null", "Any"]
      - name: CustomerRef
        type: Any
      - name: DeliveryInfo
        type: ["null", "Any"]
      - name: DepartmentRef
        type: ["null", "Any"]
      - name: Deposit
        type: ["null", "float"]
        doc: "The deposit made towards this invoice."
      - name: DepositToAccountRef
        type: ["null", "Any"]
      - name: DocNumber
        type: ["null", "string"]
        doc: "Reference number for the transaction. If not explicitly provided at create time, this field is populated based on the setting of `Preferences:CustomTxnNumber` as follows: If `Preferences:CustomTxnNumber` is true a custom value can be provided. If no value is supplied, the resulting DocNumber is null. If `Preferences:CustomTxnNumber` is false, resulting DocNumber is system generated by incrementing the last number by 1. If `Preferences:CustomTxnNumber` is false then do not send a value as it can lead to unwanted duplicates. If a DocNumber value is sent for an Update operation, then it just updates that particular invoice and does not alter the internal system DocNumber. Note: DocNumber is an optional field for all locales except France. For France locale if `Preferences:CustomTxnNumber` is enabled it will not be automatically generated and is a required field. If a duplicate DocNumber needs to be supplied, add the query parameter name/value pair, `include=allowduplicatedocnum` to the URI."
      - name: DueDate
        type: ["null", "Any"]
      - name: EmailStatus
        type: ["null", "string"]
        doc: "Email status of the invoice. Valid values: `NotSet`, `NeedToSend`, `EmailSent `"
      - name: ExchangeRate
        type: ["null", "float"]
        doc: "The number of home currency units it takes to equal one unit of currency specified by `CurrencyRef`. Applicable if multicurrency is enabled for the company."
      - name: FreeFormAddress
        type: ["null", "boolean"]
        doc: "Denotes how `ShipAddr` is stored:&nbsp;formatted or unformatted. The value of this flag is system defined based on format of shipping address at object create time.If set to `false`, shipping address is returned in a formatted style using City, Country,&nbsp;CountrySubDivisionCode, Postal code.If set to `true`, shipping address is returned in an unformatted style using Line1 through Line5 attributes."
      - name: GlobalTaxCalculation
        type: ["null", "string"]
      - name: HomeBalance
        type: ["null", "float"]
        doc: "Convenience field containing the amount in `Balance` expressed in terms of the home currency. Calculated by QuickBooks business logic. Value is valid only when `CurrencyRef` is specified. Applicable if multicurrency is enabled for the company."
      - name: HomeTotalAmt
        type: ["null", "float"]
        doc: "Total amount of the transaction in the home currency. Includes the total of all the charges, allowances and taxes. Calculated by QuickBooks business logic. Value is valid only when `CurrencyRef` is specified. Applicable if multicurrency is enabled for the company."
      - name: Id
        type: ["null", "string"]
        doc: "Unique identifier for this object."
      - name: InvoiceLink
        type: ["null", "string"]
        doc: "Sharable link for the invoice sent to external customers. The link is generated only for invoices with online payment enabled and having a valid customer email address. Include query param `include=invoiceLink` to get the link back on query response."
      - name: Line
        type: Any
      - name: LinkedTxn
        type: ["null", "Any"]
      - name: MetaData
        type: ["null", "Any"]
      - name: PrintStatus
        type: ["null", "string"]
        doc: "Printing status of the invoice. Valid values: `NotSet`, `NeedToPrint`, `PrintComplete `."
      - name: PrivateNote
        type: ["null", "string"]
        doc: "User entered, organization-private note about the transaction. This note does not appear on the invoice to the customer. This field maps to the Statement Memo field on the Invoice form in the QuickBooks Online UI."
      - name: ProjectRef
        type: ["null", "Any"]
      - name: RecurDataRef
        type: ["null", "Any"]
      - name: SalesTermRef
        type: ["null", "Any"]
      - name: ShipAddr
        type: ["null", "Any"]
      - name: ShipDate
        type: ["null", "Any"]
      - name: ShipFromAddr
        type: ["null", "Any"]
      - name: ShipMethodRef
        type: ["null", "Any"]
      - name: SyncToken
        type: ["null", "string"]
        doc: "Version number of the object. It is used to lock an object for use by one app at a time. As soon as an application modifies an object, its `SyncToken` is incremented. Attempts to modify an object specifying an older `SyncToken` fails. Only the latest version of the object is maintained by QuickBooks Online."
      - name: TaxExemptionRef
        type: ["null", "Any"]
      - name: TotalAmt
        type: ["null", "float"]
        doc: "Indicates the total amount of the transaction. This includes the total of all the charges, allowances, and taxes. Calculated by QuickBooks business logic; any value you supply is over-written by QuickBooks."
      - name: TrackingNum
        type: ["null", "string"]
        doc: "Shipping provider's tracking number for the delivery of the goods associated with the transaction."
      - name: TransactionLocationType
        type: ["null", "string"]
        doc: "The account location. For UAE, valid values include `ABUDHABI` `AJMAN` `SHARJAH` `DUBAI` `FUJAIRAH` `RAS_AL_KHAIMAH` `UMM_AL_QUWAIN` `OTHER_GCC`"
      - name: TxnDate
        type: ["null", "string"]
        doc: "The date entered by the user when this transaction occurred. yyyy/MM/dd is the valid date format.For posting transactions, this is the posting date that affects the financial statements. If the date is not supplied, the current date on the server is used.Sort order is ASC by default."
      - name: TxnSource
        type: ["null", "string"]
        doc: "Used internally to specify originating source of a credit card transaction."
      - name: TxnTaxDetail
        type: ["null", "Any"]

