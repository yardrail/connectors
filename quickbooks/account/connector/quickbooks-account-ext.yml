  - name: CreateItem
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "Create Item"
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#CreateItem_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: realmId
        type: string
        doc: "The QuickBooks company ID (Realm ID)."
      - name: minorversion
        type: ["null", "int"]
        doc: "Minor version of the QBO API."
      - name: AssetAccountRef
        type: ["null", "Any"]
      - name: CustomExtensions
        type: ["null", "Any"]
      - name: ExpenseAccountRef
        type: ["null", "Any"]
      - name: IncomeAccountRef
        type: ["null", "Any"]
      - name: InvStartDate
        type: ["null", "Any"]
      - name: Name
        type: string
        doc: "Name of the item. This value must be unique, at least one character in length, and cannot include tabs, new lines, or colons. Required for create."
      - name: QtyOnHand
        type: ["null", "float"]
        doc: "Current quantity of the `Inventory` items available for sale. Not used for `Service` or `NonInventory` type items.Required for `Inventory` type items."
      - name: Type
        type: ["null", "string"]
        doc: "Classification that specifies the use of this item. See the description at the top of the Item entity page for details about supported item types. Used for goods the company sells and buys that are tracked as inventory. `Service`--Default setting when `TrackQtyOnHand`, `InvStartDate`, and `AssetAccountRef` are not specified. Used for non-tangible goods the company sells and buys that are not tracked as inventory. For example, specialized labor, consulting hours, and professional fees. This field is required to be explicitly set with one of the following: `Inventory`--Used for goods the company sells and buys that are tracked as inventory. `Service`--Used for non-tangible goods the company sells and buys that are not tracked as inventory. For example, specialized labor, consulting hours, and professional fees. `NonInventory`--Use for goods the company sells and buys that are not tracked as inventory. For example, office supplies or goods bought on behalf of the customer. ."

