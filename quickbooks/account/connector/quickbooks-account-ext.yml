  - name: CreateCustomer
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "Create Customer"
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#CreateCustomer_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: realmId
        type: string
        doc: "The QuickBooks company ID (Realm ID)."
      - name: minorversion
        type: ["null", "int"]
        doc: "Minor version of the QBO API."
      - name: DisplayName
        type: ["null", "string"]
        doc: "The name of the person or organization as displayed. Must be unique across all Customer, Vendor, and Employee objects. Cannot be removed with sparse update. If not supplied, the system generates `DisplayName` by concatenating customer name components supplied in the request from the following list: `Title`, `GivenName`, `MiddleName`, `FamilyName`, and `Suffix`."
      - name: FamilyName
        type: ["null", "string"]
        doc: "Family name or the last name of the person. The `DisplayName` attribute or at least one of `Title`, `GivenName`, `MiddleName`, `FamilyName`, or `Suffix` attributes is required for object create."
      - name: GivenName
        type: ["null", "string"]
        doc: "Given name or first name of a person. The `DisplayName` attribute or at least one of `Title`, `GivenName`, `MiddleName`, `FamilyName`, or `Suffix` attributes is required for object create."
      - name: MiddleName
        type: ["null", "string"]
        doc: "Middle name of the person. The person can have zero or more middle names. The `DisplayName` attribute or at least one of `Title`, `GivenName`, `MiddleName`, `FamilyName`, or `Suffix` attributes is required for object create."
      - name: Suffix
        type: ["null", "string"]
        doc: "Suffix of the name. For example, `Jr`. The `DisplayName` attribute or at least one of `Title`, `GivenName`, `MiddleName`, `FamilyName`, or `Suffix` attributes is required for object create."
      - name: Title
        type: ["null", "string"]
        doc: "Title of the person. This tag supports i18n, all locales. The `DisplayName` attribute or at least one of `Title`, `GivenName`, `MiddleName`, `FamilyName`, `Suffix`, or `FullyQualifiedName` attributes are required during create."

