        type: ["null", "string"]
        doc: "The date entered by the user when this transaction occurred. For posting transactions, this is the posting date that affects the financial statements. If the date is not supplied, the current date on the server is used. Sort order is ASC by default."
      - name: TxnSource
        type: ["null", "string"]
