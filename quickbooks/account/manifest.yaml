connector:
  id: quickbooks-account
  name: QuickBooks Online Accounting
  description: Manage accounts, invoices, bills, payments, and other accounting entities in QuickBooks Online.

interfaces:
  - id: oauth
    name: QuickBooks OAuth
    protocol: rest
    auth_method: oauth2_user
    auth_scope: org
    security_scheme: OAuth2
    capabilities: [accounting]
    config_params:
      realmId: realm_id
    config_fields:
      - name: realm_id
        type: string
        label: Company ID (Realm ID)
        description: Your QuickBooks Online company ID. Found in the URL when logged into QuickBooks.
        required: true
      - name: base_url
        type: url
        label: API Base URL
        description: Override the default API URL (use https://sandbox-quickbooks.api.intuit.com for sandbox testing).
        required: false
    source:
      openapi: spec/openapi.json
      client: github.com/yardrail/connectors/quickbooks/account/client
