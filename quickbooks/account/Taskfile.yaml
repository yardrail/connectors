version: "3"

vars:
  CONNECTOR_NAME: quickbooks
  YARDRAIL_ROOT:
    sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'

tasks:
  spec:
    desc: "Generate QuickBooks Account OpenAPI spec from XSD sources"
    dir: "{{.ROOT_DIR}}/quickbooks/tools"
    cmds:
      - >-
        go run ./cmd/specgen
        -service-def {{.ROOT_DIR}}/quickbooks/spec/IntuitRestServiceDef.xsd
        -finance {{.ROOT_DIR}}/quickbooks/spec/Finance.xsd
        -base-types {{.ROOT_DIR}}/quickbooks/spec/IntuitBaseTypes.xsd
        -codes-models {{.ROOT_DIR}}/quickbooks/spec/CodesModelsJsonObjects_v2.json
        -out {{.TASKFILE_DIR}}/spec/openapi.json

  client:
    desc: "Generate QuickBooks Account Go client"
    deps: [spec]
    cmds:
      - go generate ./client/...
      - go mod tidy

  connector:
    desc: "Generate QuickBooks yardrail connector code"
    deps: [client]
    dir: "{{.ROOT_DIR}}/tools"
    cmds:
      - >-
        go run ./cmd/yardrail-connector-codegen
        -manifest {{.TASKFILE_DIR}}/manifest.yaml
        -out {{.YARDRAIL_ROOT}}/internal/connectors/{{.CONNECTOR_NAME}}
        -catalog {{.YARDRAIL_ROOT}}/internal/connector/catalog_{{.CONNECTOR_NAME}}_gen.go
        -pkgname {{.CONNECTOR_NAME}}
        -cwl-schema {{.YARDRAIL_ROOT}}/pkg/workflows/schema/{{.CONNECTOR_NAME}}-ext.yml
        -cwl-mapping {{.YARDRAIL_ROOT}}/pkg/workflows/connector_{{.CONNECTOR_NAME}}_gen.go

  build:
    desc: "Build"
    cmds:
      - go build ./...

  test:
    desc: "Run tests"
    cmds:
      - go test ./...

  vet:
    desc: "Run go vet"
    cmds:
      - go vet ./...

  lint:
    desc: "Run all checks"
    cmds:
      - task: vet
      - task: build
      - task: test
