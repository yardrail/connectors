version: "3"

tasks:
  spec:
    desc: "Generate QuickBooks Account OpenAPI spec from XSD sources"
    dir: "{{.ROOT_DIR}}/quickbooks/tools"
    cmds:
      - >-
        go run ./cmd/specgen
        -service-def {{.ROOT_DIR}}/quickbooks/spec/IntuitRestServiceDef.xsd
        -finance {{.ROOT_DIR}}/quickbooks/spec/Finance.xsd
        -base-types {{.ROOT_DIR}}/quickbooks/spec/IntuitBaseTypes.xsd
        -codes-models {{.ROOT_DIR}}/quickbooks/spec/CodesModelsJsonObjects_v2.json
        -out {{.TASKFILE_DIR}}/spec/openapi.json

  client:
    desc: "Generate QuickBooks Account Go client"
    deps: [spec]
    cmds:
      - mise exec -- go generate ./client/...

  connector:
    desc: "Generate connector code"
    deps: [client]
    dir: "{{.ROOT_DIR}}/tools"
    cmds:
      - >-
        mise exec -- go run ./cmd/yardrail-connector-codegen
        -manifest {{.TASKFILE_DIR}}/manifest.yaml
        -out {{.TASKFILE_DIR}}/connector/
        -pkgname connector
      - cd {{.TASKFILE_DIR}} && mise exec -- go mod tidy -e
  build:
    desc: "Build"
    cmds:
      - mise exec -- go build ./...

  test:
    desc: "Run tests"
    cmds:
      - mise exec -- go test ./...

  vet:
    desc: "Run go vet"
    cmds:
      - mise exec -- go vet ./...

  lint:
    desc: "Run all checks"
    cmds:
      - task: vet
      - task: build
      - task: test
