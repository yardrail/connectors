connector:
  id: monday
  name: monday.com
  description: List, find, create, read and update items, list board columns, post updates and list users on monday.com boards.

security_schemes:
  mondayToken:
    type: apiKey
    in: header
    name: Authorization

interfaces:
  - id: api
    name: API Token
    protocol: graphql
    auth_method: api_key
    auth_scope: org
    security_scheme: mondayToken
    cred_mapping:
      Authorization: token
    headers:
      API-Version: "2026-07"
    capabilities: [item.read, item.list, item.create, item.update, update.create, user.list, column.list]
    source:
      schema: spec/schema.graphql
      operations: operations/
      endpoint: https://api.monday.com/v2
      scalars:
        Date: string
        JSON: string
      descriptions:
        ListBoardItems: "Lists a board's items with their column values, optionally limited to some groups. Returns up to 500 items per group and a cursor; does not fetch further pages."
        ListItemsByColumnValues: "Finds a board's items whose column matches any of the given values. Returns up to 500 items and a cursor; does not fetch further pages."
        CreateItem: "Creates an item in a board group with initial column values. Uses only labels the board already has."
        ListBoardColumns: "Lists a board's columns with their IDs, titles, types and settings, including status and dropdown labels."
