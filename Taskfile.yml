version: "3"

tasks:
  build:tools:
    desc: Build all codegen tools
    dir: tools
    cmds:
      - go build ./cmd/...

  generate:connector:
    desc: Generate yardrail connector code from a manifest into the yardrail repo layout
    dir: tools
    requires:
      vars: [MANIFEST, NAME]
    vars:
      YARDRAIL_ROOT:
        sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'
    cmds:
      - >-
        go run ./cmd/yardrail-connector-codegen
        -manifest {{.MANIFEST}}
        -out {{.YARDRAIL_ROOT}}/internal/connectors/{{.NAME}}
        -catalog {{.YARDRAIL_ROOT}}/internal/connector/catalog_{{.NAME}}_gen.go
        -pkgname {{.NAME}}
        -cwl-schema {{.YARDRAIL_ROOT}}/pkg/workflows/schema/{{.NAME}}-ext.yml
        -cwl-mapping {{.YARDRAIL_ROOT}}/pkg/workflows/connector_{{.NAME}}_gen.go

  generate:connector:slack:
    desc: Generate yardrail Slack connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/slack/slack/manifest.yaml"
          NAME: slack

  generate:connector:hubspot:
    desc: Generate yardrail HubSpot CRM Contacts connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/hubspot/crm-contacts/v3/manifest.yaml"
          NAME: hubspot

  generate:connector:notion:
    desc: Generate yardrail Notion connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/notion/notion/manifest.yaml"
          NAME: notion

  generate:connector:canva:
    desc: Generate yardrail Canva connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/canva/canva/manifest.yaml"
          NAME: canva

  generate:connector:egnyte:
    desc: Generate yardrail Egnyte connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/egnyte/egnyte/manifest.yaml"
          NAME: egnyte

  generate:connector:mailchimp:
    desc: Generate yardrail Mailchimp connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/mailchimp/marketing/v3/manifest.yaml"
          NAME: mailchimp

  generate:connector:stripe:
    desc: Generate yardrail Stripe connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/stripe/stripe/manifest.yaml"
          NAME: stripe

  generate:connector:quickbooks:
    desc: Generate yardrail QuickBooks Account connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/quickbooks/account/manifest.yaml"
          NAME: quickbooks

  generate:connector:monday:
    desc: Generate yardrail monday.com connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/monday/monday/v2/manifest.yaml"
          NAME: monday

  spec:eventbrite:
    desc: Convert Eventbrite API Blueprint to OpenAPI 3.0
    dir: eventbrite/eventbrite/spec
    cmds:
      - npx --yes api-spec-converter@2 --from api_blueprint --to swagger_2 eventbrite-api-v3-public.apib > swagger2.json
      - python3 fixup.py swagger2 swagger2.json swagger2-fixed.json
      - npx --yes swagger2openapi@7 --patch swagger2-fixed.json -o openapi.json
      - python3 fixup.py openapi3 openapi.json
      - rm swagger2.json swagger2-fixed.json

  generate:connector:eventbrite:
    desc: Generate yardrail Eventbrite connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/eventbrite/eventbrite/manifest.yaml"
          NAME: eventbrite

  generate:connector:fireflies:
    desc: Generate yardrail Fireflies connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/fireflies/fireflies/manifest.yaml"
          NAME: fireflies

  generate:connector:outlook:
    desc: Generate yardrail Microsoft Outlook connector code
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/microsoft/outlook/manifest.yaml"
          NAME: outlook

  docs:readme:
    desc: Regenerate README.md from template
    dir: tools
    cmds:
      - go run ./cmd/gen-readme

  generate:
    desc: Run go generate across all service modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' -not -path './tools/*' -not -path './go.work' | sort); do
          dir=$(dirname "$mod")
          echo "==> generate $dir"
          (cd "$dir" && go generate ./...)
        done

  tidy:
    desc: Run go mod tidy across all modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' | sort); do
          dir=$(dirname "$mod")
          echo "==> tidy $dir"
          (cd "$dir" && go mod tidy)
        done

  build:
    desc: Build all service modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' | sort); do
          dir=$(dirname "$mod")
          echo "==> build $dir"
          (cd "$dir" && go build ./...)
        done

  test:
    desc: Run tests across all modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' | sort); do
          dir=$(dirname "$mod")
          echo "==> test $dir"
          (cd "$dir" && go test ./...)
        done

  vet:
    desc: Run go vet across all modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' | sort); do
          dir=$(dirname "$mod")
          echo "==> vet $dir"
          (cd "$dir" && go vet ./...)
        done

  lint:
    desc: Run all checks (vet + build + test)
    cmds:
      - task: vet
      - task: build
      - task: test

  list:modules:
    desc: List all Go modules in the repo
    cmds:
      - find . -name 'go.mod' -not -path './.claude/*' -exec dirname {} \; | sort

  sync:workspace:
    desc: Regenerate go.work from all go.mod files
    cmds:
      - go work init $(find . -name 'go.mod' -not -path './.claude/*' -exec dirname {} \; | sort)
