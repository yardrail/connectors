version: "3"

vars:
  TOOLS_PKG: github.com/yardrail/connectors/tools

tasks:
  build:tools:
    desc: Build all codegen tools
    dir: tools
    cmds:
      - go build ./cmd/...

  generate:connector:
    desc: Generate yardrail connector code from a manifest
    dir: tools
    requires:
      vars: [MANIFEST, SPEC, PKG, OUT, CATALOG, PKGNAME]
    cmds:
      - >-
        go run ./cmd/yardrail-connector-codegen
        -manifest {{.MANIFEST}}
        -spec {{.SPEC}}
        -pkg {{.PKG}}
        -out {{.OUT}}
        -catalog {{.CATALOG}}
        -pkgname {{.PKGNAME}}

  generate:connector:hubspot:
    desc: Generate yardrail HubSpot CRM Contacts connector code
    vars:
      YARDRAIL_ROOT:
        sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/hubspot/crm-contacts/v3/manifest.yaml"
          SPEC: "{{.ROOT_DIR}}/hubspot/crm-contacts/v3/spec/openapi.json"
          PKG: github.com/yardrail/connectors/hubspot/crm-contacts/v3/client
          OUT: "{{.YARDRAIL_ROOT}}/internal/connectors/hubspot"
          CATALOG: "{{.YARDRAIL_ROOT}}/internal/connector/catalog_hubspot_gen.go"
          PKGNAME: hubspot

  generate:connector:notion:
    desc: Generate yardrail Notion connector code
    vars:
      YARDRAIL_ROOT:
        sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/notion/notion/manifest.yaml"
          SPEC: "{{.ROOT_DIR}}/notion/notion/spec/openapi.json"
          PKG: github.com/yardrail/connectors/notion/notion/client
          OUT: "{{.YARDRAIL_ROOT}}/internal/connectors/notion"
          CATALOG: "{{.YARDRAIL_ROOT}}/internal/connector/catalog_notion_gen.go"
          PKGNAME: notion

  generate:connector:canva:
    desc: Generate yardrail Canva connector code
    vars:
      YARDRAIL_ROOT:
        sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/canva/canva/manifest.yaml"
          SPEC: "{{.ROOT_DIR}}/canva/canva/spec/openapi.json"
          PKG: github.com/yardrail/connectors/canva/canva/client
          OUT: "{{.YARDRAIL_ROOT}}/internal/connectors/canva"
          CATALOG: "{{.YARDRAIL_ROOT}}/internal/connector/catalog_canva_gen.go"
          PKGNAME: canva

  generate:connector:egnyte:
    desc: Generate yardrail Egnyte connector code
    vars:
      YARDRAIL_ROOT:
        sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/egnyte/egnyte/manifest.yaml"
          SPEC: "{{.ROOT_DIR}}/egnyte/egnyte/spec/openapi.json"
          PKG: github.com/yardrail/connectors/egnyte/egnyte/client
          OUT: "{{.YARDRAIL_ROOT}}/internal/connectors/egnyte"
          CATALOG: "{{.YARDRAIL_ROOT}}/internal/connector/catalog_egnyte_gen.go"
          PKGNAME: egnyte

  generate:connector:mailchimp:
    desc: Generate yardrail Mailchimp connector code
    vars:
      YARDRAIL_ROOT:
        sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/mailchimp/marketing/v3/manifest.yaml"
          SPEC: "{{.ROOT_DIR}}/mailchimp/marketing/v3/spec/openapi.json"
          PKG: github.com/yardrail/connectors/mailchimp/marketing/v3/client
          OUT: "{{.YARDRAIL_ROOT}}/internal/connectors/mailchimp"
          CATALOG: "{{.YARDRAIL_ROOT}}/internal/connector/catalog_mailchimp_gen.go"
          PKGNAME: mailchimp

  generate:connector:stripe:
    desc: Generate yardrail Stripe connector code
    vars:
      YARDRAIL_ROOT:
        sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/stripe/stripe/manifest.yaml"
          SPEC: "{{.ROOT_DIR}}/stripe/stripe/spec/openapi.json"
          PKG: github.com/yardrail/connectors/stripe/stripe/client
          OUT: "{{.YARDRAIL_ROOT}}/internal/connectors/stripe"
          CATALOG: "{{.YARDRAIL_ROOT}}/internal/connector/catalog_stripe_gen.go"
          PKGNAME: stripe

  generate:connector:slack:
    desc: Generate yardrail slack connector code
    vars:
      YARDRAIL_ROOT:
        sh: 'realpath "${YARDRAIL_DIR:-{{.ROOT_DIR}}/../yardrail}"'
    cmds:
      - task: generate:connector
        vars:
          MANIFEST: "{{.ROOT_DIR}}/slack/slack/manifest.yaml"
          SPEC: "{{.ROOT_DIR}}/slack/slack/spec/openapi.json"
          PKG: github.com/yardrail/connectors/slack/slack/client
          OUT: "{{.YARDRAIL_ROOT}}/internal/connectors/slack"
          CATALOG: "{{.YARDRAIL_ROOT}}/internal/connector/catalog_slack_gen.go"
          PKGNAME: slack

  generate:
    desc: Run go generate across all service modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' -not -path './tools/*' -not -path './go.work' | sort); do
          dir=$(dirname "$mod")
          echo "==> generate $dir"
          (cd "$dir" && go generate ./...)
        done

  tidy:
    desc: Run go mod tidy across all modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' | sort); do
          dir=$(dirname "$mod")
          echo "==> tidy $dir"
          (cd "$dir" && go mod tidy)
        done

  build:
    desc: Build all service modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' | sort); do
          dir=$(dirname "$mod")
          echo "==> build $dir"
          (cd "$dir" && go build ./...)
        done

  test:
    desc: Run tests across all modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' | sort); do
          dir=$(dirname "$mod")
          echo "==> test $dir"
          (cd "$dir" && go test ./...)
        done

  vet:
    desc: Run go vet across all modules
    cmds:
      - |
        for mod in $(find . -name 'go.mod' -not -path './.claude/*' | sort); do
          dir=$(dirname "$mod")
          echo "==> vet $dir"
          (cd "$dir" && go vet ./...)
        done

  lint:
    desc: Run all checks (vet + build + test)
    cmds:
      - task: vet
      - task: build
      - task: test

  list:modules:
    desc: List all Go modules in the repo
    cmds:
      - find . -name 'go.mod' -not -path './.claude/*' -exec dirname {} \; | sort

  sync:workspace:
    desc: Regenerate go.work from all go.mod files
    cmds:
      - go work init $(find . -name 'go.mod' -not -path './.claude/*' -exec dirname {} \; | sort)
