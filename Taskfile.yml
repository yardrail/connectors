version: "3"

includes:
  slack:
    taskfile: slack/Taskfile.yaml
    dir: slack
  canva:
    taskfile: canva/Taskfile.yaml
    dir: canva
  egnyte:
    taskfile: egnyte/Taskfile.yaml
    dir: egnyte
  notion:
    taskfile: notion/Taskfile.yaml
    dir: notion
  stripe:
    taskfile: stripe/Taskfile.yaml
    dir: stripe
  microsoft:
    taskfile: microsoft/Taskfile.yaml
    dir: microsoft
  hubspot:
    taskfile: hubspot/Taskfile.yaml
    dir: hubspot
  mailchimp:
    taskfile: mailchimp/Taskfile.yaml
    dir: mailchimp
  officernd:
    taskfile: officernd/Taskfile.yaml
    dir: officernd
  quickbooks:
    taskfile: quickbooks/Taskfile.yaml
    dir: quickbooks
  eventbrite:
    taskfile: eventbrite/Taskfile.yaml
    dir: eventbrite
  fireflies:
    taskfile: fireflies/Taskfile.yaml
    dir: fireflies
  monday:
    taskfile: monday/Taskfile.yaml
    dir: monday
  google:
    taskfile: google/Taskfile.yaml
    dir: google

tasks:
  spec:all:
    desc: Run spec acquisition for all connectors
    cmds:
      - task: slack:spec
      - task: canva:spec
      - task: egnyte:spec
      - task: notion:spec
      - task: stripe:spec
      - task: microsoft:spec
      - task: hubspot:spec
      - task: mailchimp:spec
      - task: officernd:spec
      - task: quickbooks:spec
      - task: eventbrite:spec
      - task: fireflies:spec
      - task: monday:spec
      - task: google:spec

  client:all:
    desc: Generate clients for all connectors
    cmds:
      - task: slack:client
      - task: canva:client
      - task: egnyte:client
      - task: notion:client
      - task: stripe:client
      - task: microsoft:client
      - task: hubspot:client
      - task: mailchimp:client
      - task: officernd:client
      - task: quickbooks:client
      - task: eventbrite:client
      - task: fireflies:client
      - task: monday:client
      - task: google:client

  connector:all:
    desc: Generate connector code for all connectors
    cmds:
      - task: slack:connector
      - task: canva:connector
      - task: egnyte:connector
      - task: notion:connector
      - task: stripe:connector
      - task: microsoft:connector
      - task: hubspot:connector
      - task: mailchimp:connector
      - task: officernd:connector
      - task: quickbooks:connector
      - task: eventbrite:connector
      - task: fireflies:connector
      - task: monday:connector
      - task: google:connector

  build:all:
    desc: Build all connectors
    cmds:
      - task: slack:build
      - task: canva:build
      - task: egnyte:build
      - task: notion:build
      - task: stripe:build
      - task: microsoft:build
      - task: hubspot:build
      - task: mailchimp:build
      - task: officernd:build
      - task: quickbooks:build
      - task: eventbrite:build
      - task: fireflies:build
      - task: monday:build
      - task: google:build

  test:all:
    desc: Run tests across all connectors
    cmds:
      - task: slack:test
      - task: canva:test
      - task: egnyte:test
      - task: notion:test
      - task: stripe:test
      - task: microsoft:test
      - task: hubspot:test
      - task: mailchimp:test
      - task: officernd:test
      - task: quickbooks:test
      - task: eventbrite:test
      - task: fireflies:test
      - task: monday:test
      - task: google:test

  vet:all:
    desc: Run go vet across all connectors
    cmds:
      - task: slack:vet
      - task: canva:vet
      - task: egnyte:vet
      - task: notion:vet
      - task: stripe:vet
      - task: microsoft:vet
      - task: hubspot:vet
      - task: mailchimp:vet
      - task: officernd:vet
      - task: quickbooks:vet
      - task: eventbrite:vet
      - task: fireflies:vet
      - task: monday:vet
      - task: google:vet

  lint:all:
    desc: Run all checks across all connectors
    cmds:
      - task: slack:lint
      - task: canva:lint
      - task: egnyte:lint
      - task: notion:lint
      - task: stripe:lint
      - task: microsoft:lint
      - task: hubspot:lint
      - task: mailchimp:lint
      - task: officernd:lint
      - task: quickbooks:lint
      - task: eventbrite:lint
      - task: fireflies:lint
      - task: monday:lint
      - task: google:lint

  build:tools:
    desc: Build all codegen tools
    cmds:
      - cd tools && mise exec -- go build ./cmd/...
      - cd quickbooks/tools && mise exec -- go build ./cmd/...
      - cd google/tools && mise exec -- go build ./cmd/...

  test:tools:
    desc: Run tests for all codegen tools
    cmds:
      - cd tools && mise exec -- go test ./...
      - cd quickbooks/tools && mise exec -- go test ./...
      - cd google/tools && mise exec -- go test ./...

  docs:readme:
    desc: Regenerate README.md from template
    dir: tools
    cmds:
      - mise exec -- go run ./cmd/gen-readme

  list:modules:
    desc: List all Go modules in the repo
    cmds:
      - find . -name 'go.mod' -not -path './.claude/*' -exec dirname {} \; | sort

