          _type: "@vocab"
      - name: designId
        type: string
        doc: "The design ID."
      - name: threadId
        type: string
        doc: "The ID of the thread."
      - name: limit
        type: ["null", "int"]
      - name: continuation
        type: ["null", "string"]
        doc: "If the success response contains a continuation token, the list contains more items you can list. You can use this token as a query parameter and retrieve more items from the list, for example `?continuation={continuation}`.\n\nTo retrieve all items, you might need to make multiple requests."

  - name: MoveFolderItem_class
    type: enum
    inVocab: false
    symbols: ["canva:MoveFolderItem"]

  - name: MoveFolderItem
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "Moves an item to another folder. You must specify the folder ID of the destination folder, as well as the ID of the item you want to move.\n\nNOTE: In some situations, a single item can exist in multiple folders. If you attempt to move an item that exists in multiple folders, the API returns an `item_in_multiple_folders` error. In this case, you must use the Canva UI to move the item to another folder."
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#MoveFolderItem_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: item_id
        type: string
        doc: "The ID of the item you want to move. Currently, video assets are not supported."
      - name: to_folder_id
        type: string
        doc: "The ID of the folder you want to move the item to (the destination folder).\nIf you want to move the item to the top level of a Canva user's\n[projects](https://www.canva.com/help/find-designs-and-folders/), use the ID `root`."

  - name: PublishBrandTemplate_class
    type: enum
    inVocab: false
    symbols: ["canva:PublishBrandTemplate"]

  - name: PublishBrandTemplate
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "<Warning>\n\nThis API is currently provided as a preview. Be aware of the following:\n\n- There might be unannounced breaking changes.\n- Any breaking changes to preview APIs won't produce a new [API version](https://www.canva.dev/docs/apps/rest-apis/versions/).\n- Public apps that use preview APIs will not pass the review process, and can't be made available to all Canva users.\n\n</Warning>\n\nAVAILABILITY: To use this API, your app must act on behalf of a user that's on a Canva plan with access to brand templates (such as Canva Pro, Canva Teams, or Canva Enterprise). Additionally, the user must have one of the following [roles](https://www.canva.com/help/roles-and-permissions/): Team admin, Brand designer, Organization admin, or Organization designer.\n\nPublishes a design as a [brand template](https://www.canva.com/help/publish-team-template/). Brand templates are design templates that can be shared across a team for consistent content creation.\n\nThis API supports two workflows:\n\n- **Initial publish**: If the design is not linked to an existing brand template, a new brand template is created.\n- **Republish**: If the design is a draft of an existing brand template (created by editing an existing template), the existing template is updated with the changes.\n\nThe API returns the published brand template immediately.\n\n<Note>\nThe `thumbnail` field might be `null` immediately after publishing, as thumbnails are generated asynchronously. You can use the [Get brand template API](https://www.canva.dev/docs/apps/rest-apis/reference/brand-templates/get-brand-template/) to retrieve the thumbnail once it's ready. The brand template's `view_url` and `create_url` are available immediately.\n</Note>"
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#PublishBrandTemplate_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: design_id
        type: string
        doc: "The ID of the design to publish as a brand template. If this design is a draft of an existing brand template, that template will be updated. Otherwise, a new brand template is created."

