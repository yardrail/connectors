        doc: "The number of brand templates to return."
      - name: ownership
        type: ["null", "string"]
        doc: "Filter the list of brand templates based on the user's ownership of the brand templates."
      - name: sort_by
        type: ["null", "string"]
        doc: "Sort the list of brand templates."
      - name: dataset
        type: ["null", "string"]
        doc: "Filter the list of brand templates based on the brand templates' dataset definitions.\nBrand templates with dataset definitions are mainly used with the [Autofill APIs](https://www.canva.dev/docs/apps/rest-apis/reference/autofills/)."

  - name: ListDesigns_class
    type: enum
    inVocab: false
    symbols: ["canva:ListDesigns"]

  - name: ListDesigns
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "Lists metadata for all the designs in a Canva user's\n[projects](https://www.canva.com/help/find-designs-and-folders/). You can also:\n\n- Use search terms to filter the listed designs.\n- Show designs either created by, or shared with the user.\n- Sort the results."
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#ListDesigns_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: query
        type: ["null", "string"]
        doc: "Lets you search the user's designs, and designs shared with the user, using a search term or terms."
      - name: continuation
        type: ["null", "string"]
        doc: "If the success response contains a continuation token, the list contains more designs\nyou can list. You can use this token as a query parameter and retrieve more\ndesigns from the list, for example\n`/v1/designs?continuation={continuation}`.\n\nTo retrieve all of a user's designs, you might need to make multiple requests."
      - name: ownership
        type: ["null", "string"]
        doc: "Filter the list of designs based on the user's ownership of the designs."
      - name: sort_by
        type: ["null", "string"]
        doc: "Sort the list of designs."
      - name: limit
        type: ["null", "int"]
        doc: "The number of designs to return."

  - name: ListFolderItems_class
    type: enum
    inVocab: false
    symbols: ["canva:ListFolderItems"]

  - name: ListFolderItems
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "Lists the items in a folder, including each item's `type`.\n\nFolders can contain:\n\n- Other folders.\n- Designs, such as Instagram posts, Presentations, and Documents ([Canva Docs](https://www.canva.com/create/documents/)).\n- Image assets.\n- Brand templates. To include `brand_template` items in the response, you must explicitly specify it in the `item_types` parameter.\n\n  AVAILABILITY: Brand template items are only returned for users on a Canva plan with access to brand templates (such as Canva Pro, Canva Teams, or Canva Enterprise). For more information, see [Brand templates](https://www.canva.dev/docs/apps/rest-apis/reference/brand-templates/).\n\nCurrently, video assets are not returned in the response."
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
    fields:
      - name: class
        type: "#ListFolderItems_class"
        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: folderId
        type: string
        doc: "The folder ID."
      - name: continuation
        type: ["null", "string"]
        doc: "If the success response contains a continuation token, the folder contains more items\nyou can list. You can use this token as a query parameter and retrieve more\nitems from the list, for example\n`/v1/folders/{folderId}/items?continuation={continuation}`.\n\nTo retrieve all the items in a folder, you might need to make multiple requests."
      - name: limit
        type: ["null", "int"]
      - name: item_types
        type: ["null", "Any"]
        doc: "Filter the folder items to only return specified types. The available types are:\n`design`, `folder`, `image`, and `brand_template`. To filter for more than one item type,\nprovide a comma-delimited list.\n\nIf not specified, defaults to returning `design`, `folder`, and `image` items.\nTo include `brand_template` items, you must explicitly specify it in this parameter."
      - name: sort_by
        type: ["null", "string"]
        doc: "Sort the list of folder items."
      - name: pin_status
        type: ["null", "string"]
        doc: "Filter the folder items by their pinned status."

  - name: ListReplies_class
    type: enum
