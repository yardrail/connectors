    symbols: ["canva:ListReplies"]

  - name: ListReplies
    type: record
    inVocab: false
    extends: cwl:Process
    documentRoot: true
    doc: "<Warning>\nThis API is currently provided as a preview. Be aware of the following:\n- There might be unannounced breaking changes.\n- Any breaking changes to preview APIs won't produce a new [API version](https://www.canva.dev/docs/apps/rest-apis/versions/).\n- Public apps that use preview APIs will not pass the review process, and can't be made available to all Canva users.\n</Warning>\n\nRetrieves a list of replies for a comment or suggestion thread on a design.\n\nFor information on comments and how they're used in the Canva UI, see the\n[Canva Help Center](https://www.canva.com/help/comments/)."
    specialize:
      - specializeFrom: cwl:InputParameter
        specializeTo: cwl:OperationInputParameter
      - specializeFrom: cwl:OutputParameter
        specializeTo: cwl:OperationOutputParameter
