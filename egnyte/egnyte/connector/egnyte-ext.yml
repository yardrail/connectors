        type: ["null", "string"]
        doc: "Optional system prompt to guide the agent's response."
      - name: question
        type: string
        doc: "The question to ask the agent. Maximum 35,000 characters."
      - name: selectedItems
        type: ["null", "Any"]
        doc: "Pre-selected files and folders to provide as context."

