connector:
  id: egnyte
  name: Egnyte
  description: Manage files, folders, and permissions in Egnyte.

interfaces:
  - id: token
    name: Access Token
    protocol: rest
    auth_method: oauth2_user
    auth_scope: org
    security_scheme: BearerAuth
    config_fields:
      - name: domain
        type: string
        label: Egnyte domain
        description: "The part before .egnyte.com in your Egnyte web address, for example urbanwork."
        required: true
    capabilities: [file.read, file.write, folder.read, folder.write, permission.read, permission.write]
    source:
      openapi: spec/openapi.fixed.json
      client: github.com/yardrail/connectors/egnyte/egnyte/client
