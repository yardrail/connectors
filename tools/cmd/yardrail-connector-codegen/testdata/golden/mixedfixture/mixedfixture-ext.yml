          _type: "@vocab"
      - name: page_id
        type: string
        doc: "Identifier for a Notion page (or block) to read or update as markdown."
      - name: insert_content
        type: ["null", "Any"]
        doc: "Deprecated. Provide when type is `insert_content`. Inserts Markdown at a position."
      - name: replace_content
        type: ["null", "Any"]
        doc: "Provide when type is `replace_content`. Replaces the entire page content."
      - name: replace_content_range
        type: ["null", "Any"]
        doc: "Deprecated. Provide when type is `replace_content_range`. Replaces a selected range of Markdown."
      - name: type
        type: string
        doc: "The kind of edit to apply. Prefer `replace_content` (overwrite the whole page) or `update_content` (targeted find-and-replace). `insert_content` and `replace_content_range` are deprecated."
      - name: update_content
        type: ["null", "Any"]
        doc: "Provide when type is `update_content`. Applies targeted find-and-replace edits."
