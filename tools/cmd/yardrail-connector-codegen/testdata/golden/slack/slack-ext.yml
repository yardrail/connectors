        jsonldPredicate:
          _id: "@type"
          _type: "@vocab"
      - name: team_ids
        type: ["null", "string"]
        doc: "Comma separated string of team IDs, signifying the workspaces to search through."
      - name: query
        type: ["null", "string"]
        doc: "Name of the the channel to query by."
      - name: limit
        type: ["null", "int"]
        doc: "Maximum number of items to be returned. Must be between 1 - 20 both inclusive. Default is 10."
      - name: cursor
        type: ["null", "string"]
        doc: "Set `cursor` to `next_cursor` returned by the previous call to list items in the next page."
      - name: search_channel_types
        type: ["null", "string"]
        doc: "The type of channel to include or exclude in the search. For example `private` will search private channels, while `private_exclude` will exclude them. For a full list of types, check the [Types section](#types)."
      - name: sort
        type: ["null", "string"]
        doc: "Possible values are `relevant` (search ranking based on what we think is closest), `name` (alphabetical), `member_count` (number of users in the channel), and `created` (date channel was created). You can optionally pair this with the `sort_dir` arg to change how it is sorted "
      - name: sort_dir
        type: ["null", "string"]
        doc: "Sort direction. Possible values are `asc` for ascending order like (1, 2, 3) or (a, b, c), and `desc` for descending order like (3, 2, 1) or (c, b, a)"

